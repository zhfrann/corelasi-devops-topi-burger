name: Continuous Integration & DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===============================================================
  # STAGE 1: FRONTEND BUILD, TEST & COVERAGE
  # ===============================================================
  frontend-ci:
    name: Frontend (Build, Vitest & Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corelasi-frontend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: corelasi-frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Validation (TypeScript & Vite)
        run: npm run build

      - name: Run Frontend Tests with Code Coverage
        run: npx vitest run --coverage

      - name: DevSecOps - Frontend Dependency Security Audit
        run: npm audit --audit-level=high || true

      - name: Upload Frontend Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: corelasi-frontend/coverage/
          retention-days: 7

  # ===============================================================
  # STAGE 2: BACKEND BUILD, TEST & COVERAGE
  # ===============================================================
  backend-ci:
    name: Backend (Check, Pytest & Audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corelasi-backend

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: corelasi-backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pip-audit

      - name: Django Configuration & System Check
        env:
          DB_ENGINE: sqlite
          SECRET_KEY: test-insecure-django-ci-secret-key-for-devops-testing
          DEBUG: "True"
        run: |
          cp .env.example .env
          sed -i 's/DB_ENGINE=postgresql/DB_ENGINE=sqlite/g' .env
          python manage.py check

      - name: Run Django Tests with Coverage
        env:
          DB_ENGINE: sqlite
          SECRET_KEY: test-insecure-django-ci-secret-key-for-devops-testing
          DEBUG: "True"
        run: |
          coverage run --source='apps,config' manage.py test
          coverage report -m
          coverage xml -o coverage.xml

      - name: DevSecOps - Backend Dependency Security Audit
        run: pip-audit || true

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: corelasi-backend/coverage.xml
          retention-days: 7

  # ===============================================================
  # STAGE 3: CODE QUALITY & SONARQUBE ANALYSIS
  # ===============================================================
  sonarqube-analysis:
    name: SonarQube / SonarCloud Code Quality Scan
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Frontend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: corelasi-frontend/coverage

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: corelasi-backend

      - name: SonarCloud / SonarQube Scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
