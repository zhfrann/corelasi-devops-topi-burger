# SonarQube / SonarCloud Project Configuration for CORELASI
sonar.projectKey=zhfrann_corelasi-devops-topi-burger
sonar.organization=zhfrann

# Encoding
sonar.sourceEncoding=UTF-8

# Source and Test Directories
sonar.sources=corelasi-frontend/src,corelasi-backend/apps,corelasi-backend/config
sonar.tests=corelasi-frontend/src/test,corelasi-backend/apps

# Test Inclusions / Exclusions
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests.py,**/test_*.py

# Coverage Report Paths
sonar.javascript.lcov.reportPaths=corelasi-frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=corelasi-backend/coverage.xml
sonar.python.version=3.12

# Exclusions from Analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.venv/**,\
  **/media/**,\
  **/staticfiles/**,\
  **/migrations/**,\
  **/icon/**,\
  docs/**
